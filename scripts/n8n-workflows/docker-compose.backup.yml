# Docker Compose for ML Companion Backup Database
# Run alongside your existing n8n instance
#
# Usage:
#   docker compose -f docker-compose.backup.yml up -d
#
# Then import the workflow JSONs into your existing n8n

version: '3.8'

services:
  # Self-hosted Postgres database for backups
  backup-db:
    image: postgres:15-alpine
    container_name: ml-companion-backup-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: backup_user
      POSTGRES_PASSWORD: ${BACKUP_DB_PASSWORD:-change_me_in_production}
      POSTGRES_DB: ml_companion_backup
    volumes:
      - backup_db_data:/var/lib/postgresql/data
      - ./init-backup-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5434:5432"  # Use 5434 to avoid port conflicts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backup_user -d ml_companion_backup"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  backup_db_data:
    driver: local
