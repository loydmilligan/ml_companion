name: Deploy to Dev

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_PI_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat > ~/.ssh/config << 'SSHEOF'
          Host dev-pi
            HostName dev-ssh.mattmariani.com
            User dietpi
            IdentityFile ~/.ssh/id_rsa
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          SSHEOF
          chmod 600 ~/.ssh/config

      - name: Deploy to Dev Pi
        env:
          DEV_SUPABASE_URL: ${{ secrets.DEV_SUPABASE_URL }}
          DEV_SUPABASE_ANON_KEY: ${{ secrets.DEV_SUPABASE_ANON_KEY }}
        run: |
          ssh dev-pi "cd ~/ml_companion && git fetch origin && git checkout develop && git pull origin develop"
          ssh dev-pi "echo 'VITE_SUPABASE_URL=${{ secrets.DEV_SUPABASE_URL }}' > ~/ml_companion/web/.env.local"
          ssh dev-pi "echo 'VITE_SUPABASE_ANON_KEY=${{ secrets.DEV_SUPABASE_ANON_KEY }}' >> ~/ml_companion/web/.env.local"
          ssh dev-pi "echo 'VITE_APP_ENV=development' >> ~/ml_companion/web/.env.local"
          ssh dev-pi "cd ~/ml_companion && docker compose down && docker compose build --no-cache && docker compose up -d"

      - name: Health check
        run: |
          echo "Waiting for app to start..."
          sleep 45
          ssh dev-pi "docker ps | grep ml_companion" && echo "Deployment successful - container is running"
