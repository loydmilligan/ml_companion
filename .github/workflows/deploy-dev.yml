name: Deploy to Dev

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Deploy to Dev Pi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: dev-ssh.mattmariani.com
          username: ${{ secrets.DEV_PI_USER }}
          key: ${{ secrets.DEV_PI_SSH_KEY }}
          proxy_command: cloudflared access ssh --hostname %h
          script: |
            cd ~/ml_companion
            git fetch origin
            git checkout develop
            git pull origin develop

            echo "VITE_SUPABASE_URL=${{ secrets.DEV_SUPABASE_URL }}" > web/.env.local
            echo "VITE_SUPABASE_ANON_KEY=${{ secrets.DEV_SUPABASE_ANON_KEY }}" >> web/.env.local
            echo "VITE_APP_ENV=development" >> web/.env.local

            docker compose down
            docker compose build --no-cache
            docker compose up -d

      - name: Health check
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: dev-ssh.mattmariani.com
          username: ${{ secrets.DEV_PI_USER }}
          key: ${{ secrets.DEV_PI_SSH_KEY }}
          proxy_command: cloudflared access ssh --hostname %h
          script: |
            sleep 45
            docker ps | grep ml_companion && echo "Deployment successful - container is running"
