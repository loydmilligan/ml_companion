name: Deploy to Production

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:  # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production  # Requires approval if configured in GitHub settings

    steps:
      - uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o cloudflared
          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_PI_SSH_KEY }}

      - name: Setup SSH Config
        run: |
          cat >> ~/.ssh/config << 'SSHEOF'
          Host prod-pi
            HostName ssh-pi.mattmariani.com
            User pi
            ProxyCommand cloudflared access ssh --hostname %h
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          SSHEOF
          chmod 600 ~/.ssh/config

      - name: Deploy to Prod Pi
        run: |
          ssh prod-pi "cd ~/ml_companion && git fetch origin && git checkout main && git reset --hard origin/main"
          ssh prod-pi "cd ~/ml_companion && DOCKER_API_VERSION=1.41 docker compose down && DOCKER_API_VERSION=1.41 docker compose build --no-cache && DOCKER_API_VERSION=1.41 docker compose up -d"

      - name: Health check
        run: |
          echo "Waiting for app to start..."
          sleep 45
          curl -f https://talking.mattmariani.com || echo "Health check needs manual verification"

      - name: Notify success
        run: echo "Deployed ${{ github.event.release.tag_name }} to production"
