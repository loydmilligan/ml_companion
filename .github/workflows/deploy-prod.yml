name: Deploy to Production

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production  # Requires approval if configured in GitHub settings

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Prod Pi
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_PI_HOST }}
          username: ${{ secrets.PROD_PI_USER }}
          key: ${{ secrets.PROD_PI_SSH_KEY }}
          script: |
            cd ~/ml_companion
            git fetch origin
            git checkout main
            git pull origin main

            docker compose down
            docker compose build --no-cache
            docker compose up -d

      - name: Health check
        run: |
          sleep 45
          curl -f https://talking.mattmariani.com || curl -f http://${{ secrets.PROD_PI_HOST }}:3080 || echo "Health check needs manual verification"

      - name: Notify success
        run: echo "Deployed ${{ github.event.release.tag_name }} to production"
